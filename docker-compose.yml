services:
  nginx:
    build: ./docker/nginx
    ports:
      - "${WEB_PORT:-8081}:80"
    environment:
      GO_PORT: ${GO_PORT:-8080}
      NGINX_ENVSUBST_FILTER: ^GO_PORT$$
    depends_on:
      - go
    networks: [appnet]

  go:
    build: ./docker/go
    init: true
    working_dir: /app
    environment:
      GOTOOLCHAIN: local
      GO_PORT: ${GO_PORT:-8080}
      GO_BUILD_TARGET: ${GO_BUILD_TARGET:-.}
      GO_BINARY_NAME: ${GO_BINARY_NAME:-app}
      GO_BUILD_OS: ${GOOS:-linux}
      GO_BUILD_ARCH: ${GOARCH:-amd64}
      CGO_ENABLED: ${CGO_ENABLED:-0}
    volumes:
      - ./src:/app
      - ./dist:/dist
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks: [appnet]

  mysql:
    image: mysql:9.7
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -uroot, -proot]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  postgres:
    image: postgres:18
    profiles: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  redis:
    image: redis:7
    command: [redis-server, --appendonly, "no"]
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
